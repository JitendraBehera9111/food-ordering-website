<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Gourmet Express</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">🍔 Gourmet<span>Express</span></div>
            <a href="index.html" class="back-link">← Back to Menu</a>
        </nav>
    </header>

    <main class="checkout-container">
        <div class="checkout-layout">
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div id="summary-items">
                    <!-- Summary injected here -->
                </div>
                <div class="summary-total">
                    <strong>Total: <span id="summary-total">$0.00</span></strong>
                </div>
            </div>

            <div class="checkout-form-section">
                <h2>Delivery Details</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required placeholder="123-456-7890">
                    </div>
                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <input type="text" id="address" required placeholder="123 Main St, City">
                    </div>
                    <div class="form-group">
                        <label for="order-type">Order Type</label>
                        <select id="order-type" required>
                            <option value="delivery">Delivery</option>
                            <option value="pickup">Pickup</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pickup-time">Scheduled Time</label>
                        <input type="datetime-local" id="pickup-time" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Place Order</button>
                </form>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Setup the minimum datetime for the pickup-time input to be "now"
        window.onload = () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('pickup-time').min = now.toISOString().slice(0,16);
        };
    </script>
</body>
</html>
